# ============================================================================
#  RAG 知识库问答系统 - Docker Compose 编排
#  启动：docker compose -f docker/docker-compose.yml up -d
#  服务：FastAPI(8000) + Streamlit(8501) + Chroma(本地持久化向量库)
#  LLM 使用 DeepSeek API（无需 Ollama）
# ============================================================================

services:
  # ==================== FastAPI 后端 ====================
  rag-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-kb-api
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - STORE_TYPE=chroma
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - QWEN_API_KEY=${QWEN_API_KEY:-}
      - PG_HOST=pgvector
      - PG_PORT=5432
      - PG_DATABASE=rag_kb
      - PG_USER=rag
      - PG_PASSWORD=rag123
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - hf_cache:/root/.cache/huggingface   # 模型缓存持久化
      - chroma_data:/app/data/chroma_db     # Chroma 向量库持久化
    depends_on:
      pgvector:
        condition: service_started
    restart: unless-stopped
    networks:
      - rag-network

  # ==================== Streamlit 前端 ====================
  rag-streamlit:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag-kb-streamlit
    ports:
      - "8501:8501"
    command: streamlit run app_streamlit.py --server.port=8501 --server.address=0.0.0.0
    environment:
      - RAG_API_BASE=http://rag-api:8000/api/v1
    depends_on:
      - rag-api
    restart: unless-stopped
    networks:
      - rag-network

  # ==================== PGvector 向量数据库（可选，STORE_TYPE=pgvector 时才使用）====================
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=rag_kb
      - POSTGRES_USER=rag
      - POSTGRES_PASSWORD=rag123
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "rag", "-d", "rag_kb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - rag-network

volumes:
  pgvector_data:
    driver: local
  chroma_data:
    driver: local
  hf_cache:
    driver: local

networks:
  rag-network:
    driver: bridge
